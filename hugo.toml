baseURL = "https://ku-cbmr.github.io/ml-notes/"
languageCode = "en-us"
title = "LLM/ML Systems Notes"
theme = "PaperMod"

canonifyURLs = true
relativeURLs = false


[params]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  defaultTheme = "auto"

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/ml-notes/posts/"
    weight = 1

  [[menu.main]]
    name = "Categories"
    url = "/ml-notes/categories/"
    weight = 2

  [[menu.main]]
    name = "Tags"
    url = "/ml-notes/tags/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/ml-notes/about/"
    weight = 4



