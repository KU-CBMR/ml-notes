baseURL = "https://ku-cbmr.github.io/ml-notes/"
languageCode = "en-us"
title = "LLM/ML Systems Notes"
theme = "PaperMod"

# 关键：设为 false。开启 true 时 Hugo 有时会错误地剥离路径
canonifyURLs = false
relativeURLs = false

[params]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  defaultTheme = "auto"

[menu]
  # 注意：这里我们手动加上子目录路径，确保链接始终正确
  [[menu.main]]
    name = "Posts"
    url = "/ml-notes/posts/"
    weight = 1

  [[menu.main]]
    name = "Categories"
    url = "/ml-notes/categories/"
    weight = 2

  [[menu.main]]
    name = "Tags"
    url = "/ml-notes/tags/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/ml-notes/about/"
    weight = 4

    
