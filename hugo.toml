baseURL = "https://ku-cbmr.github.io/ml-notes/"
languageCode = "en-us"
title = "LLM/ML Systems Notes"
theme = "PaperMod"

# 必须设为 false，防止在子路径下产生路径重叠
canonifyURLs = false
# 建议设为 false，让 Hugo 依赖 baseURL 生成绝对路径
relativeURLs = false

[params]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  defaultTheme = "auto"

[menu]
  # 注意：url 删除了开头的斜杠，这样 Hugo 会自动补全 baseURL
  [[menu.main]]
    name = "Posts"
    url = "posts/"
    weight = 1

  [[menu.main]]
    name = "Categories"
    url = "categories/"
    weight = 2

  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 4


