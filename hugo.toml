baseURL = "https://ku-cbmr.github.io/ml-notes/"
languageCode = "en-us"
title = "LLM/ML Systems Notes"
theme = "PaperMod"
canonifyURLs = true
relativeURLs = false
[params]
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  defaultTheme = "auto"

[menu]
